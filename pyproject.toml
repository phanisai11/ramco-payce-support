[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "payce-support-intelligence"
version = "0.1.0"
description = "Tenant-safe backend foundation for Payce support intelligence"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.14,<3"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pytest>=9,<10",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]
ai = [
  "httpx>=0.28,<1",
]
flows = [
  "langgraph>=1.0,<2",
]
aws = [
  "boto3>=1.40,<2",
]
gcp = [
  "google-cloud-storage>=3,<4",
  "google-cloud-pubsub>=2.33,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
]
# Nightly / weekly Ragas (G5b/G5c). `langchain-community` 0.4+ removed `vertexai` shims that Ragas imports on startup.
ragas = [
  "ragas>=0.4.3,<0.5",
  "langchain-community>=0.3.31,<0.4",
  "rapidfuzz>=3.10,<4",
  "datasets>=2.14,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payce_support"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "eval/gates"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
